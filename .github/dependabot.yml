version: 2
updates:
  # Maven dependencies (pom.xml)
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    target-branch: main
    labels:
      - dependencies
      - java
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
      include: scope
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot*"
          - "org.springframework*"
      testing:
        patterns:
          - "org.testcontainers*"
          - "io.rest-assured*"
          - "org.junit*"
          - "org.assertj*"
          - "org.mockito*"
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins*"
          - "com.google.cloud.tools*"
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Major Spring Boot upgrades need a manual migration
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: [ "version-update:semver-major" ]

  # GitHub Actions used in workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github_actions
    commit-message:
      prefix: "ci(deps)"
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"

  # Docker base images (Dockerfile)
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "build(docker)"
    ignore:
      # Stay on the JDK 25 LTS line
      - dependency-name: "bellsoft/liberica-openjdk-debian"
        update-types: [ "version-update:semver-major" ]

  # Docker Compose services (compose.yaml)
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "build(compose)"
